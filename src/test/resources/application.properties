# Valores dummy para testes — substituem as variaveis de ambiente obrigatorias
jwt.validity=3600
jwt.secret=devOnlyNotASecret000000000000000000000000000

# Push the summary check far into the future so it never fires during tests; the
# scheduler logic is covered directly by ResumoDiarioSchedulerTest.
assistente.notificacao.intervalo-verificacao-ms=86400000

# This file replaces the main application.properties and activates no profile, so
# tests need their own switch to keep the H2 schema generated by Hibernate.
spring.flyway.enabled=false

seguranca.orquestrador.token=token-ficticio-de-teste-0000000000000000
seguranca.cors.origens-permitidas=http://localhost:5173
