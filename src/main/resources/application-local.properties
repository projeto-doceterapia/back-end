spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=create-drop

# The migrations use the MySQL dialect; H2 keeps the schema generated by Hibernate.
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Dev-only JWT secret (HMAC-SHA256, Base64). Never used in prod: the prod
# profile reads JWT_SECRET from the environment with no default.
jwt.secret=devOnlyNotASecret000000000000000000000000000

# Blank turns the orchestrator service credential off.
seguranca.orquestrador.token=${ORQUESTRADOR_TOKEN:}

# Dev front-end origins.
seguranca.cors.origens-permitidas=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
