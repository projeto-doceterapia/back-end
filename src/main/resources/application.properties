spring.application.name=projetoindividual

# Local is the default profile so `mvnw spring-boot:run` and `mvnw test` run on
# H2 with no environment variables. Override with SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Virtual threads keep each open SSE connection from holding a platform thread.
spring.threads.virtual.enabled=true

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

springdoc.swagger-ui.with-credentials=true

# JWT Configuration
# Tempo de validade do token em SEGUNDOS (3600 = 1 hora)
jwt.validity=${JWT_VALIDITY:3600}

# Daily-summary check interval in milliseconds (default 5 minutes). The scheduler
# creates each summary once its configured time has passed on a working day.
assistente.notificacao.intervalo-verificacao-ms=${NOTIFICACAO_INTERVALO_VERIFICACAO_MS:300000}

# Business time zone used to compute day and business-hour boundaries, so they do
# not depend on the server's default zone.
assistente.fuso-horario=${ASSISTENTE_FUSO_HORARIO:America/Sao_Paulo}
