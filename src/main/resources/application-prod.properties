# Production profile: every value comes from the environment, no defaults.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 console must never be exposed in production.
spring.h2.console.enabled=false

# Behind the front-end /api reverse proxy: trust X-Forwarded-* so redirects
# and cookies use the external scheme/host.
server.forward-headers-strategy=framework

# JWT signing key (HMAC-SHA256, Base64). No default: the app must fail to
# start if JWT_SECRET is absent.
jwt.secret=${JWT_SECRET}
