# Production profile: every value comes from the environment, no defaults.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# H2 console must never be exposed in production.
spring.h2.console.enabled=false

# Behind the front-end /api reverse proxy: trust X-Forwarded-* so redirects
# and cookies use the external scheme/host.
server.forward-headers-strategy=framework

# JWT signing key (HMAC-SHA256, Base64). No default: the app must fail to
# start if JWT_SECRET is absent.
jwt.secret=${JWT_SECRET}

# Static service credential of the orchestrator. No default: the app must fail to
# start if ORQUESTRADOR_TOKEN is absent.
seguranca.orquestrador.token=${ORQUESTRADOR_TOKEN}

# Swagger UI and the OpenAPI document. No default: set SWAGGER_ENABLED=true to expose them.
springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}

# Comma-separated origins allowed to call the API across origins. No default; empty allows none.
seguranca.cors.origens-permitidas=${CORS_ALLOWED_ORIGINS}
